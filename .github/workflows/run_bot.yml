name: Run Telegram Bot

on:
  schedule:
    # Se ejecuta cada 5h y 50min aprox para renovar el proceso
    # Nota: El cron de GitHub no es exacto, puede haber retrasos o superposiciones.
    - cron: '*/350 * * * *' 
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # El límite máximo de un job en GitHub Actions es 6 horas (360 min).
    # Lo matamos un poco antes para que el siguiente cron tome el relevo.
    timeout-minutes: 350 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Run Bot
        run: |
          python main.py
